name: Installateurs

# À chaque envoi sur main : les installateurs sont dans l'onglet Actions (section Artifacts).
# Avec un tag v1.0, v1.1… : ils sont aussi publiés dans une Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publier une version (ex. v1.0.0) ; vide = simple construction"
        required: false
        default: ""

permissions:
  contents: write

# Un nouvel envoi annule la construction précédente encore en cours.
concurrency:
  group: installateurs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1, M2…)
            target: osx-arm64
            label: Mac-AppleSilicon
          - runner: macos-15-intel    # anciens Mac Intel
            target: osx-x64
            label: Mac-Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r packaging/requirements-app.txt
      - name: Certificat Apple (seulement si les secrets existent)
        if: ${{ env.MAC_CERT_P12 != '' }}
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
          echo "MAC_SIGN_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')" >> "$GITHUB_ENV"
      - run: packaging/build.sh ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ github.token }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          APP_VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}
      - name: Image disque (.dmg)
        run: |
          mkdir -p build/dmg
          cp -R dist/Playlist2Slsk.app build/dmg/
          ln -s /Applications build/dmg/Applications
          cp packaging/Lisez-moi-Mac.txt "build/dmg/Lisez-moi.txt"
          cp packaging/Lisez-moi-Mac.txt dist/Lisez-moi.txt
          cp LICENSE "build/dmg/Licence (GNU AGPL v3).txt"
          hdiutil create -volname Playlist2Slsk -srcfolder build/dmg -ov -format UDZO \
            "dist/Playlist2Slsk-${{ matrix.label }}.dmg"
      - name: Notarisation Apple (seulement si les secrets existent)
        if: ${{ env.MAC_SIGN_IDENTITY != '' && env.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="dist/Playlist2Slsk-${{ matrix.label }}.dmg"
          codesign --force --timestamp --sign "$MAC_SIGN_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: Playlist2Slsk-${{ matrix.label }}
          path: |
            dist/Playlist2Slsk-${{ matrix.label }}.dmg
            dist/Lisez-moi.txt
      - if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Playlist2Slsk-${{ matrix.label }}.dmg
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Playlist2Slsk ${{ inputs.version || github.ref_name }}
          body_path: packaging/release-notes.md

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r packaging/requirements-app.txt
      - run: packaging/build.sh win-x64
        env:
          GH_TOKEN: ${{ github.token }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          APP_VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}
      - name: Installateur (Inno Setup)
        shell: pwsh
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          } else { $iscc = "iscc" }
          $tagv = "${{ inputs.version }}"; if (-not $tagv -and "${{ github.ref_type }}" -eq "tag") { $tagv = "${{ github.ref_name }}" }
          $env:APP_VERSION = if ($tagv) { $tagv.TrimStart("v") } else { (Get-Content VERSION -Raw).Trim() }
          if ($env:WIN_CERT_PFX) {
            # Signature Authenticode (certificat de signature de code) : SmartScreen fait confiance plus vite
            [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_PFX))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -match "x64" | Select-Object -First 1
            & $signtool.FullName sign /f cert.pfx /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\Playlist2Slsk\Playlist2Slsk.exe
          }
          & $iscc packaging\playlist2slsk.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:WIN_CERT_PFX) {
            & $signtool.FullName sign /f cert.pfx /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\Playlist2Slsk-Windows-Setup.exe
            Remove-Item cert.pfx
          }
          Copy-Item packaging\Lisez-moi-Windows.txt dist\Lisez-moi.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Playlist2Slsk-Windows
          path: |
            dist/Playlist2Slsk-Windows-Setup.exe
            dist/Lisez-moi.txt
      - if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Playlist2Slsk-Windows-Setup.exe
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Playlist2Slsk ${{ inputs.version || github.ref_name }}
          body_path: packaging/release-notes.md
